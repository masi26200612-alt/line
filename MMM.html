                <strong>
                    0x8B93455D1434Cebc9a15c1F8133a67d86Da84EE8
                </strong>
            </div>

        </section>

        <section class="details second">

            <div class="row">

            </div>

            <div class="row">
                <span>Nonce</span>
                <strong>22</strong>

        <button>View on block explorer</button>
    </footer>
